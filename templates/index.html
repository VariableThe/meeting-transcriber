<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Meeting Transcriber</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Inter,SF Pro,Helvetica,Arial,sans-serif}
body{background:#0a0a0a;color:#e8e8e8;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 16px}
.wrap{width:100%;max-width:680px}
h1{font-size:28px;font-weight:650;letter-spacing:-0.02em}
.sub{color:#888;margin:6px 0 28px;font-size:14px}
.card{background:#141414;border:1px solid #222;border-radius:16px;padding:20px}
.drop{border:1.5px dashed #2a2a2a;border-radius:12px;padding:28px 16px;text-align:center;cursor:pointer;transition:.15s;background:#0f0f0f}
.drop:hover{border-color:#3a3a3a;background:#111}
.drop.drag{border-color:#fff;background:#1a1a1a}
.drop .icon{font-size:22px;margin-bottom:8px}
.drop p{font-size:14px;color:#999}
.drop b{color:#fff;font-weight:500}
.file-info{margin-top:12px;font-size:13px;color:#aaa;display:none;align-items:center;gap:8px;background:#1a1a1a;border:1px solid #262626;padding:10px 12px;border-radius:10px}
.file-info span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.select{flex:1;min-width:140px;background:#0f0f0f;border:1px solid #262626;color:#e8e8e8;border-radius:10px;padding:10px 12px;font-size:13px;outline:none}
.btn{width:100%;margin-top:14px;background:#fff;color:#000;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{background:#e8e8e8}
.btn:disabled{background:#222;color:#555;cursor:not-allowed}
.status{margin-top:14px;font-size:13px;color:#888;min-height:18px;text-align:center}
.status.err{color:#ff6b6b}
.status.ok{color:#7ad97a}
.result{margin-top:18px;display:none}
.result label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#777;font-weight:600}
.textarea{width:100%;margin-top:8px;background:#0f0f0f;border:1px solid #262626;color:#e8e8e8;border-radius:10px;padding:14px;font-size:14px;line-height:1.6;min-height:180px;resize:vertical;outline:none}
.textarea:focus{border-color:#333}
.actions{display:flex;gap:8px;margin-top:10px}
.small-btn{flex:1;background:#1a1a1a;border:1px solid #262626;color:#e8e8e8;border-radius:10px;padding:10px;font-size:13px;cursor:pointer}
.small-btn:hover{background:#222}
.meta{margin-top:10px;font-size:12px;color:#666;display:flex;gap:12px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:6px;background:#1a1a1a;border:1px solid #252525;padding:6px 10px;border-radius:20px;font-size:12px;color:#888}
.spinner{width:14px;height:14px;border:2px solid #333;border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{margin-top:28px;text-align:center;color:#444;font-size:12px}
a{color:#888}
</style>
</head>
<body>
<div class="wrap">
  <h1>Meeting Transcriber</h1>
  <p class="sub">Drop your 2–3 min recording · 100% local &amp; free · powered by Whisper</p>

  <div class="card">
    <div id="drop" class="drop">
      <div class="icon">⬆</div>
      <p><b>Drop audio here</b> or click to browse</p>
      <p style="margin-top:6px;font-size:12px;color:#555">mp3 · wav · m4a · ogg · webm · mp4 — up to 100MB</p>
      <input id="file" type="file" accept="audio/*,video/*,.mp3,.wav,.m4a,.ogg,.webm,.mp4,.mov,.flac" hidden>
    </div>

    <div id="fileInfo" class="file-info">
      <span>♪</span><span id="fileName"></span><span id="fileSize" style="color:#666;margin-left:auto"></span>
      <button onclick="clearFile()" style="background:none;border:none;color:#666;cursor:pointer;font-size:16px;margin-left:4px">×</button>
    </div>

    <div class="controls">
      <select id="model" class="select" title="Smaller = faster, larger = more accurate">
        <option value="tiny">tiny — fastest</option>
        <option value="base" selected>base — balanced ✓</option>
        <option value="small">small — more accurate</option>
        <option value="medium">medium — best (slower)</option>
      </select>
      <select id="lang" class="select">
        <option value="auto">Auto detect</option>
        <option value="en">English</option>
        <option value="hi">Hindi</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="ja">Japanese</option>
      </select>
    </div>

    <button id="go" class="btn" disabled>Select a file first</button>
    <div id="status" class="status"></div>

    <div id="result" class="result">
      <label>Transcription</label>
      <textarea id="out" class="textarea" placeholder="Transcription will appear here..."></textarea>
      <div class="actions">
        <button class="small-btn" onclick="copyText()">Copy</button>
        <button class="small-btn" onclick="downloadText()">Download .txt</button>
      </div>
      <div id="meta" class="meta"></div>
    </div>
  </div>

  <div class="footer">First run downloads the model (~150MB for base). Everything runs offline after that.</div>
</div>

<script>
const drop=document.getElementById('drop'), fileInput=document.getElementById('file'), go=document.getElementById('go'), statusEl=document.getElementById('status'), out=document.getElementById('out'), result=document.getElementById('result'), fileInfo=document.getElementById('fileInfo'), fileName=document.getElementById('fileName'), fileSize=document.getElementById('fileSize'), meta=document.getElementById('meta');
let file=null;

function humanSize(b){if(b<1024) return b+' B'; if(b<1048576) return (b/1024).toFixed(1)+' KB'; return (b/1048576).toFixed(1)+' MB'}

function setFile(f){
  file=f;
  fileName.textContent=f.name;
  fileSize.textContent=humanSize(f.size);
  fileInfo.style.display='flex';
  go.disabled=false;
  go.textContent='Transcribe';
  statusEl.textContent='Ready — '+f.name;
  statusEl.className='status';
}
function clearFile(){
  file=null; fileInput.value=''; fileInfo.style.display='none'; go.disabled=true; go.textContent='Select a file first'; statusEl.textContent=''; result.style.display='none';
}

drop.addEventListener('click',()=>fileInput.click());
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('drag')});
drop.addEventListener('dragleave',()=>drop.classList.remove('drag'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('drag'); if(e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0])});
fileInput.addEventListener('change',()=>{if(fileInput.files[0]) setFile(fileInput.files[0])});

go.addEventListener('click', async()=>{
  if(!file) return;
  go.disabled=true;
  go.innerHTML='<span class="spinner"></span> Transcribing…';
  statusEl.textContent='Loading model & transcribing — first time may take a minute to download model…';
  statusEl.className='status';
  result.style.display='none';
  meta.innerHTML='';

  const fd=new FormData();
  fd.append('file', file);
  fd.append('model', document.getElementById('model').value);
  fd.append('language', document.getElementById('lang').value);

  try{
    const res=await fetch('/transcribe',{method:'POST',body:fd});
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||'Transcription failed');
    out.value=data.text;
    result.style.display='block';
    statusEl.textContent='Done ✓';
    statusEl.className='status ok';
    meta.innerHTML=`<span class="badge">⏱ ${data.time_taken}s</span><span class="badge">🎙 ${data.duration}s audio</span><span class="badge">🌐 ${data.language||'auto'}</span><span class="badge">🧠 ${data.model}</span>`;
    out.focus();
  } catch(e){
    statusEl.textContent='Error: '+e.message;
    statusEl.className='status err';
  } finally{
    go.disabled=false;
    go.textContent='Transcribe again';
  }
});

function copyText(){ out.select(); document.execCommand('copy'); statusEl.textContent='Copied to clipboard ✓'; statusEl.className='status ok'; setTimeout(()=>statusEl.textContent='',2000)}
function downloadText(){
  const blob=new Blob([out.value],{type:'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(file?file.name.replace(/\.[^/.]+$/,''):'transcription')+'.txt';
  a.click();
}
</script>
</body>
</html>
